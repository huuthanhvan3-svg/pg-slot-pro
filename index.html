<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slot Intelligence · Game Analysis</title>
<meta name="description" content="Real-time slot analysis - Win Rate, RTP, Volatility, Demo Play for PG Soft and Fa Chai">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070814;--bg2:#0c0d22;--bg3:#11132e;--bg4:#161840;--border:#1b1d48;--border2:#2a2d5e;--text:#e4e5f5;--text2:#8a8db8;--text3:#4e5180;--gold:#f0b90b;--green:#00d68f;--red:#ff4757;--orange:#ff9f43;--blue:#4a7dff;--purple:#a55eea;--cyan:#00d2ff;--fc:#ff6d2d;--gradient:linear-gradient(135deg,#f0b90b,#d4a309);--radius:14px;--radius2:10px}
html{font-size:16px}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:100;background:rgba(7,8,20,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:800px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;background:var(--gradient);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.header-content{flex:1;min-width:0}
.header-title{font-size:18px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(0,214,143,.3);animation:pulse 2s infinite}
.dot.red{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,.3)}
.dot.yellow{background:var(--gold);box-shadow:0 0 8px rgba(240,185,11,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.main{max-width:800px;margin:0 auto;padding:16px;padding-bottom:90px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 6px;text-align:center}
.stat-num{font-size:22px;font-weight:800;line-height:1.2}
.stat-lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.stat.gold .stat-num{color:var(--gold)}
.stat.green .stat-num{color:var(--green)}
.stat.blue .stat-num{color:var(--blue)}
.stat.orange .stat-num{color:var(--orange)}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{border-color:var(--border2);color:var(--text)}
.tab.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.tab.fc-active{background:var(--fc);border-color:var(--fc);color:#000;font-weight:600}
.tab.pg-divider{border-color:var(--gold);color:var(--gold);background:rgba(240,185,11,.08);font-weight:700;cursor:default;font-size:10px;letter-spacing:1px;padding:8px 12px}
.tab.fc-divider{border-color:var(--fc);color:var(--fc);background:rgba(255,109,45,.08);font-weight:700;cursor:default;font-size:10px;letter-spacing:1px;padding:8px 12px}
.game{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;transition:all .2s}
.game:hover{border-color:var(--border2)}
.game-row{display:flex;gap:12px}
.game-img{width:72px;height:72px;border-radius:var(--radius2);flex-shrink:0;background:var(--bg3);overflow:hidden}
.game-img img{width:100%;height:100%;object-fit:cover}
.game-info{flex:1;min-width:0}
.game-title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px}
.game-provider{font-size:10px;color:var(--text3);margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}
.b-rtp{background:rgba(74,125,255,.12);color:var(--blue)}
.b-wr{background:rgba(0,214,143,.12);color:var(--green)}
.b-vol-l{background:rgba(0,214,143,.12);color:var(--green)}
.b-vol-m{background:rgba(240,185,11,.12);color:var(--gold)}
.b-vol-h{background:rgba(255,71,87,.12);color:var(--red)}
.b-votes{background:rgba(165,94,234,.12);color:var(--purple)}
.b-maxwin{background:rgba(255,159,67,.12);color:var(--orange)}
.b-time{background:rgba(0,210,255,.12);color:var(--cyan)}
.b-jackpot{background:rgba(255,71,87,.15);color:var(--red)}
.b-fc{background:rgba(255,109,45,.15);color:var(--fc)}
.b-new{background:rgba(240,185,11,.15);color:var(--gold)}
.play-now{margin:8px 0;display:flex;align-items:center;gap:8px}
.play-bar-wrap{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;position:relative}
.play-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.play-bar-fill.hot{background:linear-gradient(90deg,var(--green),var(--gold));box-shadow:0 0 10px rgba(240,185,11,.3)}
.play-bar-fill.warm{background:linear-gradient(90deg,var(--orange),var(--gold))}
.play-bar-fill.cold{background:linear-gradient(90deg,var(--text3),var(--text2))}
.play-label{font-size:9px;font-weight:600;white-space:nowrap}
.play-label.hot{color:var(--gold)}
.play-label.warm{color:var(--orange)}
.play-label.cold{color:var(--text3)}
.bet-levels{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin:8px 0}
.bet-level{padding:8px;border-radius:8px;background:var(--bg3);text-align:center;border:1px solid transparent}
.bet-level .lbl{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.bet-level .val{font-size:18px;font-weight:800;letter-spacing:-.5px}
.bet-level .val.high{color:var(--gold);text-shadow:0 0 12px rgba(240,185,11,.3)}
.bet-level .val.medium{color:var(--orange);text-shadow:0 0 8px rgba(255,159,67,.2)}
.bet-level .val.low{color:var(--text2)}
.bet-level .pct{font-size:9px;font-weight:600;margin-top:1px}
.bet-level .pct.high{color:var(--gold)}
.bet-level .pct.medium{color:var(--orange)}
.bet-level .pct.low{color:var(--text3)}
.bet-level.high{border-color:rgba(240,185,11,.2);background:rgba(240,185,11,.05)}
.bet-level.med{border-color:rgba(255,159,67,.15)}
.bet-level.lowb{border-color:transparent}
.bet-level .pct-df{font-size:8px;color:var(--text3);margin-top:1px}
.bar{height:4px;border-radius:2px;background:var(--bg4);margin-top:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .5s}
.bar-fill.high{background:var(--gold)}
.bar-fill.medium{background:var(--orange)}
.bar-fill.low{background:var(--text2)}
.bet-demo{display:block;margin-top:8px;padding:8px;border-radius:8px;background:var(--gradient);color:#000;font-size:11px;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.bet-demo.fc{background:linear-gradient(135deg,#ff6d2d,#ff9f43);color:#000}
.vsec{margin-bottom:20px}
.vhdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius2);margin-bottom:10px;font-size:13px;font-weight:600}
.vhdr.low{background:linear-gradient(135deg,rgba(0,214,143,.08),transparent);border:1px solid rgba(0,214,143,.15);color:var(--green)}
.vhdr.med{background:linear-gradient(135deg,rgba(240,185,11,.08),transparent);border:1px solid rgba(240,185,11,.15);color:var(--gold)}
.vhdr.high{background:linear-gradient(135deg,rgba(255,71,87,.08),transparent);border:1px solid rgba(255,71,87,.15);color:var(--red)}
.vhdr.fc{background:linear-gradient(135deg,rgba(255,109,45,.1),transparent);border:1px solid rgba(255,109,45,.2);color:var(--fc)}
.vcnt{margin-left:auto;font-size:10px;opacity:.5}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--text3)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(7,8,20,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:10px 16px}
.bottom-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.bottom-left,.bottom-right{font-size:11px;color:var(--text3)}
@media(min-width:600px){.stats{gap:12px}.stat{padding:16px}.stat-num{font-size:28px}.game-img{width:90px;height:90px}}
.bet-range-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.bet-range-item{padding:10px;border-radius:8px;background:var(--bg3);text-align:center;border:1px solid transparent}
.bet-range-item .lbl{font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.bet-range-item .val{font-size:20px;font-weight:800;letter-spacing:-.5px}
.bet-range-item .val.gold{color:var(--gold)}
.bet-range-item .val.orange{color:var(--orange)}
.bet-range-item .val.green{color:var(--green)}
.bet-range-item .sub{font-size:9px;color:var(--text2);margin-top:2px}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
<div class="header-logo">🎰</div>
<div class="header-content"><div class="header-title">Slot Intelligence</div><div class="header-sub"><span style="color:var(--gold);font-weight:700;font-size:11px">Tool by Hữu Hạo</span> <span style="color:var(--text2)">·</span> <span style="color:var(--text2);font-size:10px">PG + FC Analysis</span></div></div>
<div class="header-right"><span class="dot green" id="sdot"></span><span id="stxt" style="font-size:10px;color:var(--text3)">Live</span></div>
</div></div>
<div class="main">
<div class="stats">
<div class="stat"><div class="stat-num" id="tG">—</div><div class="stat-lbl">Games</div></div>
<div class="stat gold"><div class="stat-num" id="aRTP">—</div><div class="stat-lbl">Avg RTP</div></div>
<div class="stat green"><div class="stat-num" id="aWR">—</div><div class="stat-lbl">Avg Win Rate</div></div>
<div class="stat orange"><div class="stat-num" id="tWR">—</div><div class="stat-lbl">Top Win Rate</div></div>
</div>
<div class="tabs" id="tabs">
<!-- PG DIVIDER -->
<div class="tab pg-divider">🎮 PG SOFT</div>
<div class="tab active" data-f="pgclassic">🏆 PG Classic</div>
<div class="tab" data-f="pgnew">🆕 PG New</div>
<div class="tab" data-f="pghot">🔥 PG Hot</div>

<!-- FC DIVIDER -->
<div class="tab fc-divider">🔥 FA CHAI</div>
<div class="tab" data-f="fcall">🎮 FC Game</div>
<div class="tab" data-f="fcnew">🆕 FC New</div>
<div class="tab" data-f="fchot">🏆 FC Hot</div>

<!-- GLOBAL -->

</div>
<div id="root"><div class="loading"><div class="spinner"></div><div class="loading-txt">Đang tải dữ liệu…</div></div></div>
</div>
<div class="bottom">
  <div class="bottom-inner">
    <div class="bottom-left">
      <a href="pg-slot-pro.apk" download style="color:var(--gold);text-decoration:none;font-size:11px;font-weight:600;padding:4px 10px;background:rgba(240,185,11,.1);border-radius:6px;border:1px solid rgba(240,185,11,.2)">📱 Tải APK</a>
      <span style="color:var(--text3);margin:0 4px">·</span>
      <span style="font-size:10px;color:var(--text3)">iOS: Safari → Share → HS</span>
    </div>
    <div class="bottom-right">⏱️ <span id="cd">10</span>s · <span id="gc">0</span></div>
  </div>
</div>
<script>
const API='https://apislotget.replit.app/api/games';
const FC_DATA_URL='fc-games.json';
const BET_LEVELS=[
  {lbl:'L1',vnd:0.4},{lbl:'L2',vnd:0.8},{lbl:'L3',vnd:1.2},{lbl:'L4',vnd:1.6},{lbl:'L5',vnd:2.0},
  {lbl:'L6',vnd:2.4},{lbl:'L7',vnd:2.8},{lbl:'L8',vnd:3.2},{lbl:'L9',vnd:3.6},{lbl:'L10',vnd:4.0},
  {lbl:'L11',vnd:4},{lbl:'L12',vnd:8},{lbl:'L13',vnd:12},{lbl:'L14',vnd:16},{lbl:'L15',vnd:20},
  {lbl:'L16',vnd:24},{lbl:'L17',vnd:28},{lbl:'L18',vnd:32},{lbl:'L19',vnd:36},{lbl:'L20',vnd:40},
  {lbl:'L21',vnd:60},{lbl:'L22',vnd:100},{lbl:'L23',vnd:160},{lbl:'L24',vnd:200},{lbl:'L25',vnd:500},{lbl:'L26',vnd:1000}
];
let pgGames=[],fcGames=[],filter='pgclassic',cd=10,prevVotes={},pgAnimStates=[],animInterval=null;
const $=id=>document.getElementById(id);

function bayes(wr,n){return(wr*n+2500)/(n+50)}
function fmt(v){return typeof v==='number'?v.toFixed(2):v}
function fmt1(v){return typeof v==='number'?v.toFixed(1):v}
function fmtVnd(usd){return Math.round(usd*25)}

// === LOAD PG DATA FROM API ===
async function loadPG(){
  try{
    const r=await fetch(API+'?_='+Date.now());
    const d=await r.json();
    const raw=d.games||[];
    pgGames=raw.map((g,i)=>{
      const p=g.plus_count||0,m=g.minus_count||0,t=p+m;
      const wr=t>0?p/t*100:0;
      const bw=t>0?bayes(wr,t):0;
      let rtp=0;
      const rs=(g.details&&g.details.rtp)||'';
      const rm=rs.match(/([\d.]+)/);
      if(rm)rtp=parseFloat(rm[1]);
      const vol=(g.details&&g.details.volatility)||'Medium';
      const vl=vol.toLowerCase().includes('low')?'low':vol.toLowerCase().includes('hig')?'high':'medium';
      const prev=prevVotes[g.id||i]||t;
      const delta=t-prev;
      prevVotes[g.id||i]=t;
      const vc=g.view_count||0;
      const conf=Math.min(t/200,1);
      const rtpSc=Math.max(0,Math.min(1,(rtp-90)/10));
      const volSc={low:0.8,medium:1.0,high:0.6}[vl]||0.6;
      const isTrending=delta>0;
      const trendStrength=delta>5?delta/10:0;
      const isPopular=vc>10;
      const popScore=Math.min(vc/100,1);
      const score=(bw/100*0.30)+(rtpSc*0.20)+(volSc*0.15)+(conf*0.15)+(trendStrength*0.10)+(popScore*0.10);
      const playScore=Math.min(100,Math.round(
        (bw/100*35)+(isTrending?25:delta>-10?10:0)+(rtpSc*15)+(conf*15)+(popScore*10)
      ));
      return{
        id:g.id||i,title:g.title||'Unknown',prov:g.provider||'',
        img:g.image_url||'',demo:g.demo_link||'',
        rtp,wr,bw,n:t,vol,vl,score,
        maxWin:(g.details&&g.details.maxWin)||'',
        isTrending,delta,isPopular,vc,
        playScore,type:'pg',idx:i
      };
    });
  }catch(e){console.error('PG API error',e)}
  updatePGStats();
}

// === LOAD FC DATA ===
async function loadFC(){
  try{
    const r=await fetch(FC_DATA_URL+'?_='+Date.now());
    const d=await r.json();
    fcGames=(d.games||[]).map((g,i)=>({
      ...g,
      prov:'Fa Chai',
      type:'fc',
      idx:i,
      vl:g.vol.toLowerCase().includes('high')?'high':g.vol.toLowerCase().includes('low')?'low':'medium',
      demo:`https://web.fachaigaming.com/game/${g.fcid||22098}/en`
    }));
  }catch(e){console.error('FC load error',e)}
}

// === RENDER FC CARDS ===
function fcBetLevels(minBet,maxBet){
  const def=Math.max(0.40,minBet*2);
  const medium=minBet+(maxBet-minBet)*0.25;
  const lvls=[
    {lbl:'Default',vnd:Math.round(def*25),raw:def},
    {lbl:'Min',vnd:Math.round(minBet*25),raw:minBet},
    {lbl:'Medium',vnd:Math.round(medium*25),raw:medium},
    {lbl:'Max',vnd:Math.round(maxBet*25),raw:maxBet}
  ];
  return lvls.map((l,i)=>{
    const cls=i===0?'high':i===1?'low':i===2?'medium':'high';
    const bc=i===0?'high':i===1?'lowb':i===2?'med':'high';
    const valCls=i===0||i===3?'high':'medium';
    return`<div class="bet-level ${bc}"><div class="lbl">${l.lbl}</div><div class="val ${valCls}">${l.vnd}k</div><div class="pct ${cls}">$${l.raw.toFixed(2)}</div></div>`;
  }).join('');
}

function fcCard(g){
  const volCls=g.vl==='high'?'b-vol-h':g.vl==='low'?'b-vol-l':'b-vol-m';
  const isNew=(g.tags||[]).includes('NEW');
  const isHot=(g.tags||[]).includes('HOT');
  const isTop=(g.tags||[]).includes('TOP');
  const rtpScore=Math.min(100,Math.round((g.rtp-90)/10*100));
  const rtpCls=g.rtp>=97?'hot':g.rtp>=96?'warm':'cold';
  return`<div class="game" style="border-color:${isNew?'rgba(240,185,11,0.3)':isHot?'rgba(255,71,87,0.3)':'var(--border)'}">
    <div class="game-row">
      <div class="game-img"><img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.parentElement.innerHTML='🎰'"/></div>
      <div class="game-info">
        <div class="game-title">${g.title}</div>
        <div class="game-provider">${g.prov} · ${g.ways||''} ways · ${g.reels||''} reels</div>
        <div class="badges">
          <span class="badge b-rtp">RTP ${fmt(g.rtp)}%</span>
          <span class="badge ${volCls}">${g.vol}</span>
          <span class="badge b-maxwin">${g.maxWin}</span>
          ${isNew?`<span class="badge b-new">🆕 Mới</span>`:''}
          ${isHot?`<span class="badge b-time">🔥 Hot</span>`:''}
          ${isTop?`<span class="badge b-jackpot">🏆 Top</span>`:''}
          ${g.rating?`<span class="badge b-votes">★ ${g.rating}</span>`:''}
          ${(g.tags||[]).includes('Mega Ways')?`<span class="badge b-wr">⚡ Mega</span>`:''}
          ${(g.tags||[]).includes('Bonus Buy')?`<span class="badge b-fc">🎯 Buy</span>`:''}
        </div>
        <div class="play-now">
          <span style="font-size:10px;color:var(--text3)">RTP Score</span>
          <div class="play-bar-wrap"><div class="play-bar-fill ${rtpCls}" style="width:${rtpScore}%"></div></div>
          <span class="play-label ${rtpCls}">${fmt(g.rtp)}%</span>
        </div>
        <div class="bet-levels">
          ${fcBetLevels(g.minBet||0.10,g.maxBet||100)}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px">
          ${(g.features||[]).slice(0,4).map(f=>`<span style="font-size:9px;color:var(--text2);background:var(--bg4);padding:2px 6px;border-radius:4px">${f}</span>`).join('')}
        </div>
        <a class="bet-demo fc" href="${g.demo}" target="_blank">▶ Demo ${g.prov.split(' ')[0]}</a>
      </div>
    </div>
  </div>`;
}

function renderFCVol(games){
  const groups={};
  games.forEach(g=>{
    const v=g.vol.toLowerCase().includes('high')?'high':g.vol.toLowerCase().includes('low')?'low':'medium';
    if(!groups[v])groups[v]=[];
    groups[v].push(g);
  });
  let html='';
  if(groups.high&&groups.high.length)html+=`<div class="vsec"><div class="vhdr high">🔴 High Volatility<span class="vcnt">${groups.high.length} games</span></div>${groups.high.map(g=>fcCard(g)).join('')}</div>`;
  if(groups.medium&&groups.medium.length)html+=`<div class="vsec"><div class="vhdr med">🟡 Medium Volatility<span class="vcnt">${groups.medium.length} games</span></div>${groups.medium.map(g=>fcCard(g)).join('')}</div>`;
  if(groups.low&&groups.low.length)html+=`<div class="vsec"><div class="vhdr low">🟢 Low Volatility<span class="vcnt">${groups.low.length} games</span></div>${groups.low.map(g=>fcCard(g)).join('')}</div>`;
  return html;
}

// === PG BET LEVELS (per-game) ===
function pgBetLevels(idx, rtp, vl){
  const volFactor={high:1.8,medium:1.2,low:0.8}[vl]||1.2;
  const rtpBias=(rtp||96.5)/100;
  const seed=(idx%37)+1;
  const minVnd=Math.round((0.20+seed*0.015)*volFactor*25);
  const maxVnd=Math.round((8+seed*0.8)*rtpBias*volFactor*25);
  const defVnd=Math.min(maxVnd,Math.max(minVnd,Math.round(0.40*volFactor*25)));
  const medVnd=Math.round(minVnd+(maxVnd-minVnd)*0.35);
  return`<div class="bet-level lowb"><div class="lbl">Default</div><div class="val high">${defVnd}k</div><div class="pct low">$${(defVnd/25).toFixed(2)}</div></div>
    <div class="bet-level lowb"><div class="lbl">Min</div><div class="val low">${minVnd}k</div><div class="pct low">$${(minVnd/25).toFixed(2)}</div></div>
    <div class="bet-level lowb"><div class="lbl">Medium</div><div class="val medium">${medVnd}k</div><div class="pct medium">$${(medVnd/25).toFixed(2)}</div></div>
    <div class="bet-level lowb"><div class="lbl">Max</div><div class="val high">${maxVnd}k</div><div class="pct high">$${(maxVnd/25).toFixed(2)}</div></div>`;
}

// === WIN RATE ANIMATION ENGINE ===
function updatePGStats(){
  if(filter.startsWith('fc'))return; // don't override FC stats
  const v=pgGames.filter(g=>g.n>0);
  $('tG').textContent=pgGames.length;
  const ra=pgGames.filter(g=>g.rtp>0).map(g=>g.rtp);
  $('aRTP').textContent=ra.length?fmt1(ra.reduce((a,b)=>a+b,0)/ra.length)+'%':'—';
  $('aWR').textContent=v.length?fmt1(v.reduce((a,b)=>a+b.wr,0)/v.length)+'%':'—';
  $('tWR').textContent=v.length?fmt1(Math.max(...v.map(g=>g.bw)))+'%':'—';
  $('gc').textContent=pgGames.length;
}

function initPGAnim(){
  pgAnimStates=pgGames.map((g,i)=>{
    const baseWR=Math.min(100,Math.round(Math.max(30,g.bw||50)));
    return{
      baseWR,
      currentWR:baseWR,
      cyclePos:Math.random(),
      cycleDur:540+Math.random()*360, // 9-15 phút
      amplitude:2+Math.random()*6,    // biên độ dao động ±2-8%
      score:Math.min(100,Math.round((g.score||0.5)*100)),
      idx:i
    };
  });
}

function animatePG(){
  const cards=document.querySelectorAll('[data-pg-idx]');
  if(!cards.length||!pgAnimStates.length)return;
  const tick=1000; // 1 giây
  pgAnimStates.forEach(s=>{
    const phase=s.cyclePos;
    // Cycle: 0 = start, 1 = end → tụt về 0
    let wr;
    if(phase<0.08){
      // Đầu cycle: từ 0 lên baseWR
      wr=s.baseWR*(phase/0.08);
    }else if(phase>0.85){
      // Cuối cycle: tụt về 0
      wr=s.baseWR*(1-(phase-0.85)/0.15);
    }else{
      // Giữa cycle: dao động quanh baseWR
      const wave=Math.sin(phase*Math.PI*6)*s.amplitude;
      wr=s.baseWR+wave;
    }
    wr=Math.max(0,Math.min(100,wr));
    // Update DOM
    const card=document.querySelector(`[data-pg-idx="${s.idx}"]`);
    if(!card)return;
    const wbar=card.querySelector('.wr-bar');
    const wlbl=card.querySelector('.wr-lbl');
    if(wbar&&wlbl){
      wbar.style.width=Math.round(wr)+'%';
      wlbl.textContent=Math.round(wr*10)/10+'%';
    }
    // Score bar (animated pulse)
    const sbar=card.querySelector('.sc-bar');
    if(sbar){
      const pulse=Math.sin(phase*Math.PI*4)*3;
      const sc=Math.max(0,Math.min(100,s.score+pulse));
      sbar.style.width=sc+'%';
    }
  });
}

function startAnim(){
  stopAnim();
  if(!pgGames.length)return;
  initPGAnim();
  animatePG();
  animInterval=setInterval(animatePG,1000);
}

function stopAnim(){
  if(animInterval){clearInterval(animInterval);animInterval=null;}
}

          <div class="play-bar-wrap"><div class="play-bar-fill wr-bar ${playCls}" style="width:${Math.min(100,Math.round(g.bw))}%"></div></div>
          <span class="play-label wr-lbl ${playCls}">${fmt1(g.bw)}%</span>

// === FC AI ANALYSIS ===
function fcAiAnalyze(list){
  return list.filter(g=>g.rtp>=96).map(g=>{
    const wrS=Math.min(g.rtp/100,1);
    const rtpS=Math.max(0,(g.rtp-95)/5);
    const volFit=g.vl==='medium'?1:g.vl==='low'?0.7:0.5;
    const cnf=0.5;
    const trd=0.3;
    g.aiScore=(wrS*.30)+(rtpS*.20)+(volFit*.15)+(cnf*.15)+(trd*.10)+(.10);
    g.aiReasons=[];
    if(g.rtp>=96.8)g.aiReasons.push('💰 RTP cao');
    if(g.rtp>=97)g.aiReasons.push('🔥 RTP cực cao');
    if(g.vl==='medium')g.aiReasons.push('⚖️ Vol cân bằng');
    if((g.tags||[]).includes('HOT'))g.aiReasons.push('🔥 Game hot');
    if(g.rating>=4.5)g.aiReasons.push('⭐ Rating cao');
    return g;
  }).sort((a,b)=>b.aiScore-a.aiScore).slice(0,20);
}

// === FILTER + RENDER ===
function render(){
  // --- FC TABS ---
  if(filter==='fcall'||filter==='fcnew'||filter==='fchot'||filter==='fcai'){
    let list=[...fcGames];
    if(filter==='fcnew') list=list.filter(g=>(g.tags||[]).includes('NEW'));
    else if(filter==='fchot') list=list.filter(g=>(g.tags||[]).includes('HOT')||(g.tags||[]).includes('TOP')||g.rating>=4.3).sort((a,b)=>b.rating-a.rating);
    else if(filter==='fcai') list=fcAiAnalyze(list);

    $('tG').textContent=fcGames.length;
    const avg=fcGames.reduce((s,g)=>s+g.rtp,0)/fcGames.length;
    $('aRTP').textContent=fmt1(avg)+'%';
    $('aWR').textContent='—';
    $('tWR').textContent=Math.max(...fcGames.map(g=>g.rtp)).toFixed(1)+'%';
    
    const icon=filter==='fcnew'?'🆕':filter==='fchot'?'🏆':filter==='fcai'?'🧠':'🔥';
    const infoBar=`<div style="margin-bottom:12px;padding:12px;background:rgba(255,109,45,.06);border:1px solid rgba(255,109,45,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--fc)">${icon} FA CHAI GAMING — ${list.length} games</strong><br>
      <span style="color:var(--text2)">RTP trung bình ${fmt1(avg)}% · Từ $0.10 đến $1,000 mỗi spin</span>
    </div>`;
    
    if(filter==='fcai'){
      $('root').innerHTML=infoBar+list.map(g=>fcCard(g)).join('');
    }else{
      $('root').innerHTML=infoBar+renderFCVol(list);
    }
    return;
  }
  stopAnim();
  // --- PG TABS ---
  let a=[...pgGames];
  switch(filter){
    case 'pgclassic': a=a.filter(g=>g.rtp>0||g.n>0).sort((a,b)=>b.playScore-a.playScore);break;
    case 'pgnew': a=a.filter(g=>g.rtp>0||g.n>0).sort((a,b)=>b.idx-a.idx).slice(0,30);break;
    case 'pghot': a=a.filter(g=>(g.rtp>0||g.n>0)&&(g.playScore>=50||g.isTrending)).sort((a,b)=>b.playScore-a.playScore);break;
    case 'pgai': {
      const good=a.filter(g=>g.rtp>0||g.n>0);
      good.forEach(g=>{
        const wrS=g.bw/100,rtpS=Math.max(0,(g.rtp-95)/5),volFit=g.vl==='medium'?1:g.vl==='low'?0.7:0.5,cnf=Math.min(g.n/200,1),trd=Math.min(g.n/500,1),trendB=g.isTrending?.15:0;
        g.aiScore=(wrS*.30)+(rtpS*.20)+(volFit*.15)+(cnf*.15)+(trd*.10)+(trendB*.10);
        g.aiReasons=[];
        if(g.bw>=85)g.aiReasons.push('🔥 WR cao');
        if(g.rtp>=96.8)g.aiReasons.push('💰 RTP cao');
        if(g.vl==='medium')g.aiReasons.push('⚖️ Vol cân bằng');
        if(g.n>=500)g.aiReasons.push('📊 Dữ liệu lớn');
        if(g.n>=100)g.aiReasons.push('✅ Sample đủ');
        if(g.isTrending)g.aiReasons.push('📈 Đang hot (+'+g.delta+' votes)');
      });
      a=good.sort((a,b)=>b.aiScore-a.aiScore).slice(0,20);
      break;
    }
    case 'trending': a=a.filter(g=>g.n>0).sort((a,b)=>b.delta-a.delta).slice(0,30);break;
  }
  a.sort((a,b)=>b.score-a.score);

  const v=pgGames.filter(g=>g.n>0);
  $('tG').textContent=pgGames.length;
  const ra=pgGames.filter(g=>g.rtp>0).map(g=>g.rtp);
  $('aRTP').textContent=ra.length?fmt1(ra.reduce((a,b)=>a+b,0)/ra.length)+'%':'—';
  $('aWR').textContent=v.length?fmt1(v.reduce((a,b)=>a+b.wr,0)/v.length)+'%':'—';
  $('tWR').textContent=v.length?fmt1(Math.max(...v.map(g=>g.bw)))+'%':'—';
  $('gc').textContent=pgGames.length;

  const rt=$('root');
  if(filter==='pgclassic'){
    const trending=a.filter(g=>g.isTrending).sort((a,b)=>b.delta-a.delta);
    const featured=[...a].sort((a,b)=>b.score-a.score).slice(0,3);
    const highWR=[...a].sort((a,b)=>b.bw-a.bw).slice(0,10);
    rt.innerHTML=`
      ${trending.length?`<div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(255,71,87,.1),transparent);border:1px solid rgba(255,71,87,.2);color:var(--red)">🔥 Đang lên <span class="vcnt">${trending.length} games</span></div>
        ${trending.slice(0,5).map(g=>pgCard(g)).join('')}
      </div>`:''}
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(240,185,11,.1),transparent);border:1px solid rgba(240,185,11,.2);color:var(--gold)">🎯 Featured Games <span class="vcnt">Top 3</span></div>
        ${featured.map(g=>pgCard(g)).join('')}
      </div>
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(0,214,143,.1),transparent);border:1px solid rgba(0,214,143,.2);color:var(--green)">📈 High Winrate <span class="vcnt">Top 10</span></div>
        ${highWR.map(g=>pgCard(g)).join('')}
      </div>`;
      startAnim();
  }else if(filter==='pgai'){
    rt.innerHTML=`<div style="margin-bottom:12px;padding:12px;background:rgba(240,185,11,.06);border:1px solid rgba(240,185,11,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--gold)">🤖 PG AI - Đề xuất từ dữ liệu</strong><br>
      <span style="color:var(--text2)">Phân tích Bayesian WR + RTP + Vol + Confidence</span>
    </div>${a.map(g=>pgAiCard(g)).join('')}`;
      startAnim();
  }else{
    rt.innerHTML=`<div style="margin-bottom:12px;padding:12px;background:rgba(240,185,11,.06);border:1px solid rgba(240,185,11,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--gold)">🎮 PG SOFT — ${a.length} games</strong><br>
      <span style="color:var(--text2)">Dữ liệu vote real-time từ cộng đồng</span>
    </div>${a.slice(0,50).map(g=>pgCard(g)).join('')}`;
      startAnim();
  }
}

// === TABS CLICK ===
$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');
  if(!t||t.classList.contains('pg-divider')||t.classList.contains('fc-divider'))return;
  $('tabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('active','fc-active'));
  if(t.dataset.f.startsWith('fc')) t.classList.add('fc-active');
  else t.classList.add('active');
  filter=t.dataset.f;
  render();
});
