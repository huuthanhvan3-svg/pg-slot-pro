<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PG Slot Pro · Hot Game Intelligence</title>
<meta name="description" content="PG Slot real-time analysis - Win Rate, RTP, Volatility, Demo Play">
<meta name="theme-color" content="#070814">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #070814;
  --bg2: #0c0d22;
  --bg3: #11132e;
  --bg4: #161840;
  --border: #1b1d48;
  --border2: #2a2d5e;
  --text: #e4e5f5;
  --text2: #8a8db8;
  --text3: #4e5180;
  --gold: #f0b90b;
  --gold2: #d4a309;
  --green: #00d68f;
  --red: #ff4757;
  --orange: #ff9f43;
  --blue: #4a7dff;
  --purple: #a55eea;
  --cyan: #00d2ff;
  --gradient: linear-gradient(135deg, #f0b90b 0%, #d4a309 100%);
  --radius: 14px;
  --radius2: 10px;
}

html { font-size: 16px; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ====== HEADER ====== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(7,8,20,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 800px; margin: 0 auto;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.header-logo {
  width: 40px; height: 40px;
  background: var(--gradient);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.header-content { flex: 1; min-width: 0; }
.header-title { font-size: 18px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; }
.header-right { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.green { background: var(--green); box-shadow: 0 0 8px rgba(0,214,143,0.3); }
.dot.red { background: var(--red); box-shadow: 0 0 8px rgba(255,71,87,0.3); }
.dot.yellow { background: var(--gold); box-shadow: 0 0 8px rgba(240,185,11,0.3); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.dot.green { animation: pulse 2s infinite; }

/* ====== MAIN ====== */
.main { max-width: 800px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }

/* ====== STATS ROW ====== */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
.stat {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
  padding: 12px 6px; text-align: center;
}
.stat-num { font-size: 22px; font-weight: 800; line-height: 1.2; }
.stat-lbl { font-size: 8px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
.stat.gold .stat-num { color: var(--gold); }
.stat.green .stat-num { color: var(--green); }
.stat.blue .stat-num { color: var(--blue); }
.stat.orange .stat-num { color: var(--orange); }

/* ====== TABS ====== */
.tabs {
  display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--text2); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: all .2s;
}
.tab:hover { border-color: var(--border2); color: var(--text); }
.tab.active { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 600; }

/* ====== GAME CARD ====== */
.game {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; margin-bottom: 10px; transition: all .2s;
}
.game:hover { border-color: var(--border2); }
.game-row { display: flex; gap: 12px; }
.game-img {
  width: 72px; height: 72px; border-radius: var(--radius2); flex-shrink: 0;
  background: var(--bg3); overflow: hidden;
}
.game-img img { width: 100%; height: 100%; object-fit: cover; }
.game-info { flex: 1; min-width: 0; }
.game-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.game-provider { font-size: 10px; color: var(--text3); margin-bottom: 6px; }

.game-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.badge {
  font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
  display: inline-flex; align-items: center; gap: 3px;
}
.b-rtp { background: rgba(74,125,255,.12); color: var(--blue); }
.b-wr { background: rgba(0,214,143,.12); color: var(--green); }
.b-vol-l { background: rgba(0,214,143,.12); color: var(--green); }
.b-vol-m { background: rgba(240,185,11,.12); color: var(--gold); }
.b-vol-h { background: rgba(255,71,87,.12); color: var(--red); }
.b-votes { background: rgba(165,94,234,.12); color: var(--purple); }
.b-maxwin { background: rgba(255,159,67,.12); color: var(--orange); }

/* ====== VOLATILITY BAR ====== */
.vol-bar-wrap {
  height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden;
  margin: 8px 0;
}
.vol-bar-fill {
  height: 100%; border-radius: 3px; transition: width .5s ease;
}
.vol-bar-fill.low { background: var(--green); width: 30%; }
.vol-bar-fill.medium { background: var(--gold); width: 55%; }
.vol-bar-fill.high { background: var(--red); width: 85%; }

.vol-label {
  display: flex; justify-content: space-between;
  font-size: 9px; color: var(--text3); margin-top: 2px;
}

/* ====== BET SUGGESTION ====== */
.bet-box {
  margin-top: 8px; padding: 10px; border-radius: var(--radius2);
  background: rgba(240,185,11,.04); border: 1px solid rgba(240,185,11,.1);
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.bet-item {
  font-size: 11px; background: rgba(240,185,11,.08);
  padding: 4px 10px; border-radius: 6px; color: var(--text2);
}
.bet-item strong { color: var(--gold); }
.bet-demo {
  margin-left: auto; padding: 6px 14px; border-radius: 8px;
  background: var(--gradient); color: #000; font-size: 11px;
  font-weight: 700; text-decoration: none; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.bet-demo:hover { transform: scale(1.05); }

/* ====== VOL SECTION ====== */
.vsec { margin-bottom: 20px; }
.vhdr {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: var(--radius2);
  margin-bottom: 10px; font-size: 13px; font-weight: 600;
}
.vhdr.low { background: linear-gradient(135deg,rgba(0,214,143,.08),transparent); border:1px solid rgba(0,214,143,.15); color:var(--green); }
.vhdr.med { background: linear-gradient(135deg,rgba(240,185,11,.08),transparent); border:1px solid rgba(240,185,11,.15); color:var(--gold); }
.vhdr.high { background: linear-gradient(135deg,rgba(255,71,87,.08),transparent); border:1px solid rgba(255,71,87,.15); color:var(--red); }
.vcnt { margin-left: auto; font-size: 10px; opacity: .5; }

/* ====== LOADING ====== */
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px;
}
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--gold); border-radius: 50%;
  animation: spin .8s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-size: 13px; color: var(--text3); }

/* ====== BOTTOM ====== */
.bottom {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(7,8,20,.95); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); padding: 10px 16px;
}
.bottom-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.bottom-left, .bottom-right { font-size: 11px; color: var(--text3); }

/* ====== RESPONSIVE ====== */
@media (min-width:600px) {
  .stats { gap: 12px; }
  .stat { padding: 16px; }
  .stat-num { font-size: 28px; }
  .game-img { width: 90px; height: 90px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-logo">🎰</div>
    <div class="header-content">
      <div class="header-title">PG Slot Pro</div>
      <div class="header-sub">Hot Game Intelligence · Real-time Data</div>
    </div>
    <div class="header-right">
      <span class="dot green" id="sdot"></span>
      <span id="stxt" style="font-size:10px;color:var(--text3)">Live</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="tG">—</div><div class="stat-lbl">Games</div></div>
    <div class="stat gold"><div class="stat-num" id="aRTP">—</div><div class="stat-lbl">Avg RTP</div></div>
    <div class="stat green"><div class="stat-num" id="aWR">—</div><div class="stat-lbl">Avg B-WR</div></div>
    <div class="stat orange"><div class="stat-num" id="tWR">—</div><div class="stat-lbl">Top WR</div></div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-f="all">🏆 Tất cả</div>
    <div class="tab" data-f="hot">🔥 Hot game</div>
    <div class="tab" data-f="top">⭐ Top 20</div>
    <div class="tab" data-f="low">🟢 Low Vol</div>
    <div class="tab" data-f="medium">🟡 Med Vol</div>
    <div class="tab" data-f="high">🔴 High Vol</div>
    <div class="tab" data-f="ai">🤖 PG Ai</div>
    <div class="tab" data-f="ailocal">🧠 Ai Local</div>
  </div>

  <div id="root">
    <div class="loading"><div class="spinner"></div><div class="loading-txt">Đang tải dữ liệu…</div></div>
  </div>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <div class="bottom-left">⏱️ <span id="cd">30</span>s</div>
    <div class="bottom-right"><span id="gc">0</span> games</div>
  </div>
</div>

<script>
const API = 'https://apislotget.replit.app/api/games';
const VOL_BET = {
  low:    { pct:'1–2%', bank:'vốn nhỏ', desc:'Thắng nhỏ liên tục, an toàn', spins:'50–100', bar:30 },
  medium: { pct:'0.5–1%', bank:'vốn TB', desc:'Cân bằng, phù hợp mọi bankroll', spins:'30–50', bar:55 },
  high:   { pct:'0.25–0.5%', bank:'vốn lớn', desc:'Big hit tiềm năng, rủi ro cao', spins:'20–30', bar:85 }
};

let games=[], filter='all', cd=30, ci, fi;

const $=id=>document.getElementById(id);

function volLevel(v){
  const s=(v||'').toLowerCase();
  if(s.includes('low')) return 'low';
  if(s.includes('med')) return 'medium';
  if(s.includes('hig')) return 'high';
  return 'medium';
}

function bayes(wr,n){
  return (wr*n+50*50)/(n+50);
}

function fmt(v){return typeof v==='number'?v.toFixed(2):v}
function fmt1(v){return typeof v==='number'?v.toFixed(1):v}

async function load(){
  try{
    const r=await fetch(API+'?_='+Date.now());
    const d=await r.json();
    const raw=d.games||[];
    
    games=raw.map(g=>{
      const p=g.plus_count||0, m=g.minus_count||0, t=p+m;
      const wr=t>0?p/t*100:0;
      const bw=t>0?bayes(wr,t):0;
      let rtp=0;
      const rs=(g.details&&g.details.rtp)||'';
      const rm=rs.match(/([\d.]+)/);
      if(rm) rtp=parseFloat(rm[1]);
      
      const vol=(g.details&&g.details.volatility)||'Medium';
      const vl=volLevel(vol);
      const bet=VOL_BET[vl];
      const conf=Math.min(t/200,1);
      const rtpSc=Math.max(0,Math.min(1,(rtp-90)/10));
      const volSc={low:.8,medium:1.0,high:.6}[vl]||.6;
      const score=(bw/100*.35)+(rtpSc*.25)+(volSc*.2)+(conf*.2);
      
      return {
        title:g.title||'Unknown', prov:g.provider||'',
        img:g.image_url||'', demo:g.demo_link||'',
        rtp,wr,bw,n:t, vol,vl,bet,score,
        maxWin:(g.details&&g.details.maxWin)||'',
        paylines:(g.details&&g.details.paylines)||'',
        reels:(g.details&&g.details.reels)||''
      };
    });
    
    $('sdot').className='dot green';
    $('stxt').textContent=new Date().toLocaleTimeString();
    render();
  }catch(e){
    $('sdot').className='dot red';
    $('stxt').textContent='Error';
  }
}

function filtered(){
  let a=[...games];
  switch(filter){
    case 'hot': a=a.filter(g=>g.rtp>=96.5&&g.bw>=80); break;
    case 'top': a.sort((a,b)=>b.score-a.score); a=a.slice(0,20); break;
    case 'low': a=a.filter(g=>g.vl==='low'); break;
    case 'medium': a=a.filter(g=>g.vl==='medium'); break;
    case 'high': a=a.filter(g=>g.vl==='high'); break;
    case 'ai': a=aiOriginal(a); break;
    case 'ailocal': a=aiLocal(a); break;
  }
  a.sort((a,b)=>b.score-a.score);
  return a;
}

function renderStats(){
  const v=games.filter(g=>g.n>0);
  $('tG').textContent=games.length;
  const ra=games.filter(g=>g.rtp>0).map(g=>g.rtp);
  $('aRTP').textContent=ra.length?fmt1(ra.reduce((a,b)=>a+b,0)/ra.length)+'%':'—';
  const wa=v.map(g=>g.wr);
  $('aWR').textContent=wa.length?fmt1(wa.reduce((a,b)=>a+b,0)/wa.length)+'%':'—';
  $('tWR').textContent=wa.length?fmt1(Math.max(...wa))+'%':'—';
  $('gc').textContent=games.length;
}

function card(g){
  const volCls={low:'b-vol-l',medium:'b-vol-m',high:'b-vol-h'}[g.vl];
  const volLbl={low:'Low',medium:'Medium',high:'High'}[g.vl];
  const barPct=VOL_BET[g.vl]?VOL_BET[g.vl].bar:55;
  
  return `
    <div class="game">
      <div class="game-row">
        <div class="game-img">
          <img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.parentElement.innerHTML='🎰'" />
        </div>
        <div class="game-info">
          <div class="game-title">${g.title}</div>
          <div class="game-provider">${g.prov}</div>
          <div class="game-badges">
            ${g.rtp>0?`<span class="badge b-rtp">RTP ${fmt(g.rtp)}%</span>`:''}
            ${g.n>0?`<span class="badge b-wr">B-WR ${fmt1(g.bw)}%</span>`:''}
            <span class="badge ${volCls}">${g.vol}</span>
            ${g.n>0?`<span class="badge b-votes">${g.n} votes</span>`:''}
            ${g.maxWin?`<span class="badge b-maxwin">${g.maxWin}</span>`:''}
            ${g.reels?`<span class="badge b-rtp">${g.reels} reels</span>`:''}
          </div>
          
          <!-- Volatility Bar -->
          <div class="vol-bar-wrap">
            <div class="vol-bar-fill ${g.vl}" style="width:${barPct}%"></div>
          </div>
          <div class="vol-label">
            <span>Low</span>
            <span style="font-weight:700;color:var(--${g.vl==='low'?'green':g.vl==='medium'?'gold':'red'})">${volLbl}</span>
            <span>High</span>
          </div>
          
          <!-- Bet Suggestion -->
          <div class="bet-box">
            <span class="bet-item">💰 <strong>${g.bet.pct}</strong> mỗi spin</span>
            <span class="bet-item">🎯 <strong>${g.bet.spins}</strong> spins</span>
            <span class="bet-item">📊 <strong>${g.bet.desc}</strong></span>
            <a class="bet-demo" href="${g.demo}" target="_blank">▶ Demo</a>
          </div>
        </div>
      </div>
    </div>
  `;
}

function sec(vl,list){
  if(!list.length) return '';
  const L={low:{i:'🟢',t:'Low Volatility · Bet nhỏ, thắng đều',c:'low'},
            medium:{i:'🟡',t:'Medium Volatility · Cân bằng, tối ưu',c:'med'},
            high:{i:'🔴',t:'High Volatility · Big hit, rủi ro cao',c:'high'}}[vl];

// === AI ORIGINAL - Giống bản gốc PG Ai, chọn game theo votes + WR ===
function aiOriginal(list){
  return list.filter(g=>g.n>=30).sort((a,b)=>{
    // Ưu tiên: WR cao + votes nhiều + RTP cao
    const sa = a.bw * Math.min(a.n/100,1) * (a.rtp>=96.5?1.2:1);
    const sb = b.bw * Math.min(b.n/100,1) * (b.rtp>=96.5?1.2:1);
    return sb-sa;
  }).slice(0,15);
}

// === AI LOCAL - Thuật toán riêng của em ===
function aiLocal(list){
  // Lọc game chất lượng
  const good = list.filter(g=>g.rtp>=96&&g.n>=20);
  
  // Tính điểm chi tiết
  good.forEach(g=>{
    // WR confidence (Bayesian)
    const wrScore = g.bw/100;
    // RTP score
    const rtpScore = Math.max(0,(g.rtp-95)/5);
    // Volatility fit (Medium = best)
    const volFit = g.vl==='medium'?1:g.vl==='low'?0.7:0.5;
    // Sample confidence
    const conf = Math.min(g.n/200,1);
    // Trend indicator (giả định: votes gần đây nhiều = đang hot)
    const trend = Math.min(g.n/500,1);
    
    g.aiScore = (wrScore*0.35)+(rtpScore*0.25)+(volFit*0.2)+(conf*0.15)+(trend*0.05);
    g.aiReason = [];
    
    // Lý do AI đề xuất
    if(g.bw>=85) g.aiReason.push('🔥 WR cao');
    if(g.rtp>=96.8) g.aiReason.push('💰 RTP siêu cao');
    if(g.vl==='medium') g.aiReason.push('⚖️ Vol cân bằng');
    if(g.n>=500) g.aiReason.push('📊 Dữ liệu lớn, đáng tin');
    if(g.n>=100) g.aiReason.push('✅ Sample đủ lớn');
    if(g.rtp>=96.5&&g.vl==='medium') g.aiReason.push('🎯 Sweet spot!');
    if(g.bw>=90) g.aiReason.push('🏆 Top win rate');
  });
  
  return good.sort((a,b)=>b.aiScore-a.aiScore).slice(0,20);
}

function aiCard(g, isLocal){
  const volCls={low:'b-vol-l',medium:'b-vol-m',high:'b-vol-h'}[g.vl];
  
  return `
    <div class="game" style="border-color:rgba(240,185,11,0.3)">
      <div class="game-row">
        <div class="game-img">
          <img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.parentElement.innerHTML='🎰'" />
        </div>
        <div class="game-info">
          <div class="game-title">${g.title}</div>
          <div class="game-provider">${g.prov}</div>
          <div class="game-badges">
            ${isLocal?`<span class="badge b-wr" style="background:rgba(240,185,11,.2);color:var(--gold)">🧠 AI Score ${fmt(g.aiScore)}</span>`:''}
            ${g.rtp>0?`<span class="badge b-rtp">RTP ${fmt(g.rtp)}%</span>`:''}
            ${g.n>0?`<span class="badge b-wr">B-WR ${fmt1(g.bw)}%</span>`:''}
            <span class="badge ${volCls}">${g.vol}</span>
            ${g.n>0?`<span class="badge b-votes">${g.n} votes</span>`:''}
            ${g.maxWin?`<span class="badge b-maxwin">${g.maxWin}</span>`:''}
          </div>
          
          <!-- Volatility Bar -->
          <div class="vol-bar-wrap">
            <div class="vol-bar-fill ${g.vl}" style="width:${VOL_BET[g.vl]?VOL_BET[g.vl].bar:55}%"></div>
          </div>
          
          ${isLocal&&g.aiReason?`
          <div style="margin:8px 0;padding:8px 10px;background:rgba(240,185,11,.06);border-radius:8px;font-size:11px;line-height:1.6">
            <strong style="color:var(--gold)">🧠 Phân tích AI:</strong><br>
            ${g.aiReason.map(r=>`<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;background:rgba(240,185,11,.1);border-radius:4px;color:var(--gold)">${r}</span>`).join('')}
          </div>`:''}
          
          <!-- Bet Suggestion -->
          <div class="bet-box">
            <span class="bet-item">💰 <strong>${g.bet.pct}</strong> mỗi spin</span>
            <span class="bet-item">🎯 <strong>${g.bet.spins}</strong> spins</span>
            <span class="bet-item">📊 <strong>${g.bet.desc}</strong></span>
            <a class="bet-demo" href="${g.demo}" target="_blank">▶ Demo</a>
          </div>
        </div>
      </div>
    </div>
  `;
}
  return `<div class="vsec">
    <div class="vhdr ${L.c}">${L.i} ${L.t}<span class="vcnt">${list.length} games</span></div>
    ${list.map(card).join('')}
  </div>`;
}

function render(){
  renderStats();
  const a=filtered();
  const rt=$('root');
  
  if(!a.length){
    rt.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">📭 Không có game phù hợp</div>';
    return;
  }
  
  if(filter==='all'){
    const gr={low:[],medium:[],high:[]};
    a.forEach(g=>{if(gr[g.vl])gr[g.vl].push(g)});
    rt.innerHTML=(sec('medium',gr.medium)+sec('low',gr.low)+sec('high',gr.high))||'<div style="text-align:center;padding:40px;color:var(--text3)">📭 Không có game</div>';
  }else if(filter==='ailocal'||filter==='ai'){
    rt.innerHTML=`<div style="margin-bottom:12px;padding:12px;background:rgba(240,185,11,.06);border:1px solid rgba(240,185,11,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--gold)">${filter==='ailocal'?'🧠 AI Local - Thuật toán riêng':'🤖 PG Ai - Đề xuất từ dữ liệu'}</strong><br>
      <span style="color:var(--text2)">${filter==='ailocal'?'Phân tích Bayesian WR + RTP + Volatility + Confidence. Chọn game tối ưu nhất cho bạn.':'Dựa trên WR cao + votes nhiều + RTP cao, giống bản gốc PG Ai.'}</span>
    </div>${a.map(g=>aiCard(g,filter==='ailocal')).join('')}`;
  }else{
    rt.innerHTML=a.slice(0,50).map(card).join('');
  }
}

// Tabs
$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');
  if(!t)return;
  $('tabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  filter=t.dataset.f;
  render();
});

// Countdown
setInterval(()=>{
  cd--;
  $('cd').textContent=cd;
  if(cd<=0){cd=30;load();}
},1000);

// SW
if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

load();
</script>
</body>
</html>
