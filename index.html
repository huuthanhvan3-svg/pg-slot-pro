async function load(){
  try{
    const r=await fetch(API+'?_='+Date.now());
    const d=await r.json();
    const raw=d.games||[];

    games=raw.map((g,i)=>{
      const p=g.plus_count||0,m=g.minus_count||0,t=p+m;
      const wr=t>0?p/t*100:0;
      const bw=t>0?bayes(wr,t):0;
      let rtp=0;
      const rs=(g.details&&g.details.rtp)||'';
      const rm=rs.match(/([\d.]+)/);
      if(rm)rtp=parseFloat(rm[1]);

      const vol=(g.details&&g.details.volatility)||'Medium';
      const vl=vol.toLowerCase().includes('low')?'low':vol.toLowerCase().includes('hig')?'high':'medium';

      const prev=prevVotes[g.id||i]||t;
      const delta=t-prev;
      prevVotes[g.id||i]=t;

      const vc=g.view_count||0;
      const conf=Math.min(t/200,1);
      const rtpSc=Math.max(0,Math.min(1,(rtp-90)/10));
      const volSc={low:0.8,medium:1.0,high:0.6}[vl]||0.6;

      const isTrending=delta>0;
      const trendStrength=delta>5?delta/10:0;
      const isPopular=vc>10;
      const popScore=Math.min(vc/100,1);

      const score=(bw/100*0.30)+(rtpSc*0.20)+(volSc*0.15)+(conf*0.15)+(trendStrength*0.10)+(popScore*0.10);

      const playScore=Math.min(100,Math.round(
        (bw/100*35)+(isTrending?25:delta>-10?10:0)+(rtpSc*15)+(conf*15)+(popScore*10)
      ));

      return{
        title:g.title||'Unknown',prov:g.provider||'',
        img:g.image_url||'',demo:g.demo_link||'',
        rtp,wr,bw,n:t,vol,vl,score,
        maxWin:(g.details&&g.details.maxWin)||'',
        paylines:(g.details&&g.details.paylines)||'',
        reels:(g.details&&g.details.reels)||'',
        isTrending,delta,trendStrength,isPopular,vc,
        playScore,
        idx:i
      };
    });

    const now=new Date();
    const vnNow=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Ho_Chi_Minh'}));
    $('sdot').className='dot green';
    $('stxt').textContent=vnNow.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});

    $('vnTime').textContent=vnNow.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('sdot').className='dot red';
    $('stxt').textContent='Error';
  }
}

function filtered(){
  let a=[...games];
  switch(filter){
    case 'hot': a=a.filter(g=>g.playScore>=60||g.isTrending);break;
    case 'top': a.sort((a,b)=>b.score-a.score).slice(0,30);break;
    case 'low': a=a.filter(g=>g.vl==='low');break;
    case 'medium': a=a.filter(g=>g.vl==='medium');break;
    case 'high': a=a.filter(g=>g.vl==='high');break;
    case 'vote': a=a.filter(g=>g.n>0);break;
    case 'classic': a=a.filter(g=>g.n>=10&&(g.prov.includes('PG Soft')||g.title.includes('PG Soft'))).sort((a,b)=>b.playScore-a.playScore);break;
    case 'pp': a=a.filter(g=>g.n>=10&&g.prov.includes('Pragmatic')).sort((a,b)=>b.playScore-a.playScore);break;

    case 'ai': a=a.filter(g=>g.n>=30).sort((a,b)=>(b.bw*Math.min(b.n/100,1)*(b.rtp>=96.5?1.2:1))-(a.bw*Math.min(a.n/100,1)*(a.rtp>=96.5?1.2:1))).slice(0,20);break;

      </div>
    </div>
  </div>`;
}

function aiCard(g,isLocal){
  const volCls={low:'b-vol-l',medium:'b-vol-m',high:'b-vol-h'}[g.vl];
  const playCls=g.playScore>=70?'hot':g.playScore>=40?'warm':'cold';
  const wrPct=Math.min(100,Math.round(g.bw));
  const blDef=BET_LEVELS[0],blMin=BET_LEVELS[9],blMed=BET_LEVELS[19],blMax=BET_LEVELS[25];
  const wrCls=g.bw>=70?'high':g.bw>=45?'medium':'low';

  return`<div class="game" style="border-color:rgba(240,185,11,0.3)">
    <div class="game-row">
      <div class="game-img"><img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.parentElement.innerHTML='🎰'"/></div>
      <div class="game-info">
        <div class="game-title">${g.title}</div>
        <div class="game-provider">${g.prov} · ${g.n} votes</div>
        <div class="badges">
          ${isLocal?`<span class="badge b-wr" style="background:rgba(240,185,11,.2);color:var(--gold)">🧠 ${fmt(g.aiScore)}</span>`:''}
          ${g.rtp>0?`<span class="badge b-rtp">RTP ${fmt(g.rtp)}%</span>`:''}
          ${g.n>0?`<span class="badge b-wr">WR ${fmt1(g.bw)}%</span>`:''}
          <span class="badge ${volCls}">${g.vol}</span>
          ${g.isTrending?`<span class="badge b-time">📈 +${g.delta}</span>`:''}
        </div>

        <div class="play-now">
          <span style="font-size:10px;color:var(--text3)">Win Rate</span>
          <div class="play-bar-wrap"><div class="play-bar-fill ${playCls}" style="width:${wrPct}%"></div></div>
          <span class="play-label ${playCls}">${fmt1(g.bw)}%</span>
        </div>

        ${isLocal&&g.aiReasons?`<div style="margin:6px 0;padding:8px;background:rgba(240,185,11,.06);border-radius:8px;font-size:11px">
          <strong style="color:var(--gold)">🧠 AI phan tich:</strong> ${g.aiReasons.map(r=>`<span style="display:inline-block;margin:2px;padding:2px 6px;background:rgba(240,185,11,.1);border-radius:4px;color:var(--gold)">${r}</span>`).join('')}
        </div>`:''}

        <div class="bet-levels">
          <div class="bet-level ${wrCls}"><div class="lbl">Default</div><div class="val high">${blDef.vnd}k</div><div class="pct ${wrCls}">${blDef.lbl}</div></div>
          <div class="bet-level ${wrCls}"><div class="lbl">Min</div><div class="val medium">${blMin.vnd}k</div><div class="pct ${wrCls}">${blMin.lbl}</div></div>
          <div class="bet-level ${wrCls}"><div class="lbl">Medium</div><div class="val medium">${blMed.vnd}k</div><div class="pct ${wrCls}">${blMed.lbl}</div></div>
          <div class="bet-level ${wrCls}"><div class="lbl">Max</div><div class="val high">${blMax.vnd}k</div><div class="pct ${wrCls}">${blMax.lbl}</div></div>
        </div>

        <a class="bet-demo" href="${g.demo}" target="_blank">▶ Choi Demo</a>
      </div>
    </div>
  </div>`;
}

function render(){
  // For FC tabs, render embedded data
  if(filter==='fc'||filter==='fcnew'||filter==='fchot'){
    let fcGames=[...FC_GAMES];
    if(filter==='fcnew'){
      fcGames=fcGames.filter(g=>g.tags.includes("NEW")).sort((a,b)=>new Date(b.date)-new Date(a.date));
    }else if(filter==='fchot'){
      fcGames=fcGames.filter(g=>g.tags.includes("HOT")||g.tags.includes("TOP")||g.rating>=4.3).sort((a,b)=>b.rating-a.rating);
    }
    const totalFc=FC_GAMES.length;
    const avgRtp=FC_GAMES.reduce((s,g)=>s+g.rtp,0)/totalFc;
    $('tG').textContent=totalFc;
    $('aRTP').textContent=fmt1(avgRtp)+'%';
    $('aWR').textContent='—';
    $('tWR').textContent=Math.max(...FC_GAMES.map(g=>g.rtp)).toFixed(1)+'%';
    const icon=filter==='fcnew'?'🆕':filter==='fchot'?'🏆':'🔥';
    const title=filter==='fcnew'?'FC Games Mới Nhất':filter==='fchot'?'FC Games Hot Nhất':'Tất Cả Game Fa Chai';
    const infoBar=`<div style="margin-bottom:12px;padding:12px;background:rgba(255,109,45,.06);border:1px solid rgba(255,109,45,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--orange)">${icon} FA CHAI GAMING — ${totalFc} games</strong><br>
      <span style="color:var(--text2)">RTP trung bình ${fmt1(avgRtp)}% · Từ $0.10 đến $1,000 mỗi spin · Có Bonus Buy, Cascading, Megaways</span>
    </div>`;
    $('root').innerHTML=infoBar+renderFC(fcGames,title,icon);
    return;
  }

  const v=games.filter(g=>g.n>0);
  $('tG').textContent=games.length;
  const ra=games.filter(g=>g.rtp>0).map(g=>g.rtp);
  $('aRTP').textContent=ra.length?fmt1(ra.reduce((a,b)=>a+b,0)/ra.length)+'%':'—';
  $('aWR').textContent=v.length?fmt1(v.reduce((a,b)=>a+b.wr,0)/v.length)+'%':'—';
  $('tWR').textContent=v.length?fmt1(Math.max(...v.map(g=>g.bw)))+'%':'—';
  $('gc').textContent=games.length;

  const a=filtered();
  const rt=$('root');
  if(!a.length){rt.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">📭 Khong co game</div>';return;}

  if(filter==='vote'){
    const gr={low:[],medium:[],high:[]};
    a.forEach(g=>{if(gr[g.vl])gr[g.vl].push(g)});
    const sec=(vl,list)=>{
      if(!list.length)return'';
      const L={low:{i:'🟢',t:'Low Vol',c:'low'},medium:{i:'🟡',t:'Medium Vol',c:'med'},high:{i:'🔴',t:'High Vol',c:'high'}}[vl];
      return`<div class="vsec"><div class="vhdr ${L.c}">${L.i} ${L.t}<span class="vcnt">${list.length} games</span></div>${list.map(x=>card(x)).join('')}</div>`;
    };
    rt.innerHTML=sec('medium',gr.medium)+sec('low',gr.low)+sec('high',gr.high);
  }else if(filter==='classic'){
    const trending=a.filter(g=>g.isTrending).sort((a,b)=>b.delta-a.delta);
    const featured=[...a].sort((a,b)=>b.score-a.score).slice(0,3);
    const highWR=[...a].sort((a,b)=>b.bw-a.bw).slice(0,10);
    rt.innerHTML=`
      ${trending.length?`<div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(255,71,87,.1),transparent);border:1px solid rgba(255,71,87,.2);color:var(--red)">🔥 Dang len <span class="vcnt">${trending.length} games</span></div>
        ${trending.slice(0,5).map(card).join('')}
      </div>`:''}
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(240,185,11,.1),transparent);border:1px solid rgba(240,185,11,.2);color:var(--gold)">🎯 Feature Games <span class="vcnt">Top 3</span></div>
        ${featured.map(card).join('')}
      </div>
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(0,214,143,.1),transparent);border:1px solid rgba(0,214,143,.2);color:var(--green)">📈 High Winrate <span class="vcnt">Top 10</span></div>
        ${highWR.map(card).join('')}
      </div>`;
  }else if(filter==='ailocal'||filter==='ai'){
    rt.innerHTML=`<div style="margin-bottom:12px;padding:12px;background:rgba(240,185,11,.06);border:1px solid rgba(240,185,11,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--gold)">${filter==='ailocal'?'🧠 AI Local - Thuat toan rieng':'🤖 PG Ai - De xuat tu du lieu'}</strong><br>
      <span style="color:var(--text2)">${filter==='ailocal'?'Phan tich Bayesian WR + RTP + Vol + Trending':'Dua tren WR + votes + RTP.'}</span>
    </div>${a.map(g=>aiCard(g,filter==='ailocal')).join('')}`;
  }else{
    rt.innerHTML=a.slice(0,50).map(card).join('');
  }
}

$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');
  if(!t)return;
  $('tabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  filter=t.dataset.f;
  // Don't fetch API for FC tabs
  if(filter==='fc'||filter==='fcnew'||filter==='fchot'){
    render();
    return;
  }
  render();
  if(games.length>0)render();
  else load();
});

setInterval(()=>{cd--;$('cd').textContent=cd;if(cd<=0){cd=10;load();}},1000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
