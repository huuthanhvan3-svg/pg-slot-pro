<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PG Slot Pro · Hot Game Intelligence</title>
<meta name="description" content="PG Slot real-time analysis - Win Rate, RTP, Volatility, Demo Play">
<meta name="theme-color" content="#070814">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070814;--bg2:#0c0d22;--bg3:#11132e;--bg4:#161840;--border:#1b1d48;--border2:#2a2d5e;--text:#e4e5f5;--text2:#8a8db8;--text3:#4e5180;--gold:#f0b90b;--green:#00d68f;--red:#ff4757;--orange:#ff9f43;--blue:#4a7dff;--purple:#a55eea;--gradient:linear-gradient(135deg,#f0b90b,#d4a309);--radius:14px;--radius2:10px}
html{font-size:16px}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:100;background:rgba(7,8,20,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:800px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;background:var(--gradient);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.header-content{flex:1;min-width:0}
.header-title{font-size:18px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(0,214,143,.3);animation:pulse 2s infinite}
.dot.red{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,.3)}
.dot.yellow{background:var(--gold);box-shadow:0 0 8px rgba(240,185,11,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.main{max-width:800px;margin:0 auto;padding:16px;padding-bottom:90px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 6px;text-align:center}
.stat-num{font-size:22px;font-weight:800;line-height:1.2}
.stat-lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.stat.gold .stat-num{color:var(--gold)}
.stat.green .stat-num{color:var(--green)}
.stat.blue .stat-num{color:var(--blue)}
.stat.orange .stat-num{color:var(--orange)}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{border-color:var(--border2);color:var(--text)}
.tab.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.game{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;transition:all .2s}
.game:hover{border-color:var(--border2)}
.game-row{display:flex;gap:12px}
.game-img{width:72px;height:72px;border-radius:var(--radius2);flex-shrink:0;background:var(--bg3);overflow:hidden}
.game-img img{width:100%;height:100%;object-fit:cover}
.game-info{flex:1;min-width:0}
.game-title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px}
.game-provider{font-size:10px;color:var(--text3);margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}
.b-rtp{background:rgba(74,125,255,.12);color:var(--blue)}
.b-wr{background:rgba(0,214,143,.12);color:var(--green)}
.b-vol-l{background:rgba(0,214,143,.12);color:var(--green)}
.b-vol-m{background:rgba(240,185,11,.12);color:var(--gold)}
.b-vol-h{background:rgba(255,71,87,.12);color:var(--red)}
.b-votes{background:rgba(165,94,234,.12);color:var(--purple)}
.b-maxwin{background:rgba(255,159,67,.12);color:var(--orange)}
.b-time{background:rgba(0,210,255,.12);color:var(--cyan)}
.b-jackpot{background:rgba(255,71,87,.15);color:var(--red)}
/* Play Now Indicator */
.play-now{margin:8px 0;display:flex;align-items:center;gap:8px}
.play-bar-wrap{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;position:relative}
.play-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.play-bar-fill.hot{background:linear-gradient(90deg,var(--green),var(--gold));box-shadow:0 0 10px rgba(240,185,11,.3)}
.play-bar-fill.warm{background:linear-gradient(90deg,var(--orange),var(--gold))}
.play-bar-fill.cold{background:linear-gradient(90deg,var(--text3),var(--text2))}
.play-label{font-size:9px;font-weight:600;white-space:nowrap}
.play-label.hot{color:var(--gold)}
.play-label.warm{color:var(--orange)}
.play-label.cold{color:var(--text3)}
/* Bet Levels */
.bet-levels{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin:8px 0}
.bet-level{padding:8px;border-radius:8px;background:var(--bg3);text-align:center}
.bet-level .lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.bet-level .val{font-size:16px;font-weight:800}
.bet-level .val.high{color:var(--gold)}
.bet-level .val.medium{color:var(--orange)}
.bet-level .val.low{color:var(--text2)}
.bet-level .bar{height:4px;border-radius:2px;background:var(--bg4);margin-top:4px;overflow:hidden}
.bet-level .bar-fill{height:100%;border-radius:2px;transition:width .5s}
.bet-level .bar-fill.high{background:var(--gold)}
.bet-level .bar-fill.medium{background:var(--orange)}
.bet-level .bar-fill.low{background:var(--text2)}
.bet-demo{display:block;margin-top:8px;padding:8px;border-radius:8px;background:var(--gradient);color:#000;font-size:11px;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.vsec{margin-bottom:20px}
.vhdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius2);margin-bottom:10px;font-size:13px;font-weight:600}
.vhdr.low{background:linear-gradient(135deg,rgba(0,214,143,.08),transparent);border:1px solid rgba(0,214,143,.15);color:var(--green)}
.vhdr.med{background:linear-gradient(135deg,rgba(240,185,11,.08),transparent);border:1px solid rgba(240,185,11,.15);color:var(--gold)}
.vhdr.high{background:linear-gradient(135deg,rgba(255,71,87,.08),transparent);border:1px solid rgba(255,71,87,.15);color:var(--red)}
.vcnt{margin-left:auto;font-size:10px;opacity:.5}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--text3)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(7,8,20,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:10px 16px}
.bottom-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.bottom-left,.bottom-right{font-size:11px;color:var(--text3)}
@media(min-width:600px){.stats{gap:12px}.stat{padding:16px}.stat-num{font-size:28px}.game-img{width:90px;height:90px}}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
<div class="header-logo">🎰</div>
<div class="header-content"><div class="header-title">PG Slot Pro</div><div class="header-sub">Hot Game Intelligence</div></div>
<div class="header-right"><span class="dot green" id="sdot"></span><span id="stxt" style="font-size:10px;color:var(--text3)">Live</span></div>
</div></div>
<div class="main">
<div class="stats">
<div class="stat"><div class="stat-num" id="tG">—</div><div class="stat-lbl">Games</div></div>
<div class="stat gold"><div class="stat-num" id="aRTP">—</div><div class="stat-lbl">Avg RTP</div></div>
<div class="stat green"><div class="stat-num" id="aWR">—</div><div class="stat-lbl">Avg B-WR</div></div>
<div class="stat orange"><div class="stat-num" id="tWR">—</div><div class="stat-lbl">Top WR</div></div>
</div>
<div class="tabs" id="tabs">
<div class="tab active" data-f="vote">🏆 Vote</div>
<div class="tab" data-f="classic">🎮 PG Classic</div>
<div class="tab" data-f="ai">🤖 PG Ai</div>
<div class="tab" data-f="ailocal">🧠 Ai Local</div>
</div>
<div id="root"><div class="loading"><div class="spinner"></div><div class="loading-txt">Đang tải dữ liệu…</div></div></div>
</div>
<div class="bottom"><div class="bottom-inner">
<div class="bottom-left">⏱️ <span id="cd">30</span>s · <span id="vnTime"></span></div>
<div class="bottom-right"><span id="gc">0</span> games</div>
</div></div>
<script>
const API='https://apislotget.replit.app/api/games';
const VOL_BET={low:{pct:'1-2%',spins:'50-100',desc:'Thắng nhỏ đều',bar:30},medium:{pct:'0.5-1%',spins:'30-50',desc:'Cân bằng',bar:55},high:{pct:'0.25-0.5%',spins:'20-30',desc:'Big hit',bar:85}};
const BET_VND=[
  {lbl:'Min 1',vnd:0.4},{lbl:'Min 2',vnd:0.8},{lbl:'Min 3',vnd:1.2},{lbl:'Min 4',vnd:1.6},{lbl:'Min 5',vnd:2.0},
  {lbl:'Med 1',vnd:2},{lbl:'Med 2',vnd:6},{lbl:'Med 3',vnd:10},{lbl:'Med 4',vnd:14},{lbl:'Med 5',vnd:18},
  {lbl:'Max 1',vnd:20},{lbl:'Max 2',vnd:60},{lbl:'Max 3',vnd:100},{lbl:'Max 4',vnd:140},{lbl:'Max 5',vnd:180}
];
let games=[],filter='vote',cd=10;
const $=id=>document.getElementById(id);

function volLevel(v){
  const s=(v||'').toLowerCase();
  if(s.includes('low'))return'low';
  if(s.includes('med'))return'medium';
  if(s.includes('hig'))return'high';
  return'medium';
}

function bayes(wr,n){return(wr*n+2500)/(n+50)}
function fmt(v){return typeof v==='number'?v.toFixed(2):v}
function fmt1(v){return typeof v==='number'?v.toFixed(1):v}

// === Hàm deterministic theo ngày (giống calcFormula gốc) ===
function dailySeed(gameIdx){
  const d=new Date();
  const dateStr=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'-'+gameIdx;
  let hash=0;
  for(let i=0;i<dateStr.length;i++){hash=((hash<<5)-hash)+dateStr.charCodeAt(i);hash|=0;}
  return Math.abs(hash);
}

function dailyRange(min,max,gameIdx,mult){
  const seed=dailySeed(gameIdx*(mult||1));
  return min+(seed%(max-min+1));
}

function calcBetChance(gameIdx,mult){
  return 5+dailySeed(gameIdx*mult)%95;
}

// === Phân tích game ===
async function load(){
  try{
    const r=await fetch(API+'?_='+Date.now());
    const d=await r.json();
    const raw=d.games||[];
    const now=new Date();
    const vnNow=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Ho_Chi_Minh'}));
    const curH=vnNow.getHours(),curM=vnNow.getMinutes();
    
    games=raw.map((g,i)=>{
      const p=g.plus_count||0,m=g.minus_count||0,t=p+m;
      const wr=t>0?p/t*100:0;
      const bw=t>0?bayes(wr,t):0;
      let rtp=0;
      const rs=(g.details&&g.details.rtp)||'';
      const rm=rs.match(/([\d.]+)/);
      if(rm)rtp=parseFloat(rm[1]);
      
      const vol=(g.details&&g.details.volatility)||'Medium';
      const vl=volLevel(vol);
      const bet=VOL_BET[vl];
      const conf=Math.min(t/200,1);
      const rtpSc=Math.max(0,Math.min(1,(rtp-90)/10));
      const volSc={low:.8,medium:1.0,high:.6}[vl]||.6;
      const score=(bw/100*.35)+(rtpSc*.25)+(volSc*.2)+(conf*.2);
      
      // === Daily-deterministic values (giống calcFormula gốc) ===
      const timeH=dailyRange(0,23,i,1);
      const timeM=dailyRange(0,1,i,2); // 0=00, 1=30
      const timeStr=String(timeH).padStart(2,'0')+':'+(timeM?timeM*30:'00');
      const timeEndH=timeM?timeH+1:timeH;
      const timeEndStr=String(timeEndH).padStart(2,'0')+':'+(timeM?'00':'30');
      const timeRangeStr=timeStr+' - '+timeEndStr;
      
      // Check if current time is within hot time
      const hotStart=timeH*60+timeM*30;
      const hotEnd=timeEndH*60+(timeM?0:30);
      const curMin=curH*60+curM;
      const isHotNow=curMin>=hotStart&&curMin<hotEnd;
      
      // Bet chances (giống bản gốc)
      const betFollow=calcBetChance(i,1);
      const betMin=calcBetChance(i,3);
      const betMed=calcBetChance(i,2);
      const betMax=calcBetChance(i,4);
      
      // Play now indicator
      const timeDist=Math.min(
        Math.abs(curMin-hotStart),
        Math.abs(curMin-hotEnd),
        1440-Math.abs(curMin-hotStart),
        1440-Math.abs(curMin-hotEnd)
      );
      const timeScore=isHotNow?100:Math.max(0,100-timeDist/14.4);
      
      // Composite play score
      const playScore=Math.round(
        (bw/100*30)+(timeScore/100*25)+(rtpSc*20)+(conf*15)+(volSc*10)
      );
      
      // Jackpot frequency (deterministic daily)
      const jackpotFreq=dailyRange(0,200,i,6);
      
      return{
        title:g.title||'Unknown',prov:g.provider||'',
        img:g.image_url||'',demo:g.demo_link||'',
        rtp,wr,bw,n:t,vol,vl,bet,score,
        maxWin:(g.details&&g.details.maxWin)||'',
        paylines:(g.details&&g.details.paylines)||'',
        reels:(g.details&&g.details.reels)||'',
        // Original PG Classic features
        timeH,timeM,timeStr,timeRangeStr,isHotNow,playScore,
        betFollow,betMin,betMed,betMax,
        jackpotFreq,
        idx:i
      };
    });
    
    $('sdot').className='dot green';
    $('stxt').textContent=new Date().toLocaleTimeString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'});
    render();
    // Update VN time every minute
    setInterval(()=>{
      $('vnTime').textContent=new Date().toLocaleTimeString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit'});
    },60000);
    $('vnTime').textContent=new Date().toLocaleTimeString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('sdot').className='dot red';
    $('stxt').textContent='Error';
  }
}

function filtered(){
  let a=[...games];
  switch(filter){
    case 'hot': a=a.filter(g=>g.isHotNow||g.playScore>=70);break;
    case 'top': a.sort((a,b)=>b.score-a.score);a=a.slice(0,20);break;
    case 'low': a=a.filter(g=>g.vl==='low');break;
    case 'medium': a=a.filter(g=>g.vl==='medium');break;
    case 'high': a=a.filter(g=>g.vl==='high');break;
    case 'vote': a=a.filter(g=>g.n>0);break;
    case 'classic': a=a.filter(g=>g.n>=10).sort((a,b)=>b.playScore-a.playScore);break;
    case 'ai': a=a.filter(g=>g.n>=30).sort((a,b)=>(b.bw*Math.min(b.n/100,1)*(b.rtp>=96.5?1.2:1))-(a.bw*Math.min(a.n/100,1)*(a.rtp>=96.5?1.2:1))).slice(0,20);break;
    case 'ailocal': {
      const good=a.filter(g=>g.rtp>=96&&g.n>=20);
      good.forEach(g=>{
        const wrS=g.bw/100,rtpS=Math.max(0,(g.rtp-95)/5),volFit=g.vl==='medium'?1:g.vl==='low'?0.7:0.5,cnf=Math.min(g.n/200,1),trd=Math.min(g.n/500,1);
        g.aiScore=(wrS*.35)+(rtpS*.25)+(volFit*.2)+(cnf*.15)+(trd*.05);
        g.aiReasons=[];
        if(g.bw>=85)g.aiReasons.push('🔥 WR cao');
        if(g.rtp>=96.8)g.aiReasons.push('💰 RTP cao');
        if(g.vl==='medium')g.aiReasons.push('⚖️ Vol cân bằng');
        if(g.n>=500)g.aiReasons.push('📊 Dữ liệu lớn');
        if(g.n>=100)g.aiReasons.push('✅ Sample đủ');
        if(g.isHotNow)g.aiReasons.push('⏰ Giờ đẹp!');
      });
      a=good.sort((a,b)=>b.aiScore-a.aiScore).slice(0,20);break;
    }
    case 'jackpot': a.sort((a,b)=>b.jackpotFreq-a.jackpotFreq).slice(0,30);break;
    case 'winrate': a.sort((a,b)=>b.bw-a.bw).slice(0,30);break;
  }
  a.sort((a,b)=>b.score-a.score);
  return a;
}

function renderStats(){
  const v=games.filter(g=>g.n>0);
  $('tG').textContent=games.length;
  const ra=games.filter(g=>g.rtp>0).map(g=>g.rtp);
  $('aRTP').textContent=ra.length?fmt1(ra.reduce((a,b)=>a+b,0)/ra.length)+'%':'—';
  $('aWR').textContent=v.length?fmt1(v.reduce((a,b)=>a+b.wr,0)/v.length)+'%':'—';
  $('tWR').textContent=v.length?fmt1(Math.max(...v.map(g=>g.wr)))+'%':'—';
  $('gc').textContent=games.length;
}

function betBar(pct,cls){return`<div class="bar"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>`;}

function card(g){
  const volCls={low:'b-vol-l',medium:'b-vol-m',high:'b-vol-h'}[g.vl];
  const volLbl={low:'Low',medium:'Medium',high:'High'}[g.vl];
  const barPct=VOL_BET[g.vl]?VOL_BET[g.vl].bar:55;
  const playCls=g.playScore>=70?'hot':g.playScore>=40?'warm':'cold';
  const maxBet=Math.max(g.betFollow,g.betMin,g.betMax);
  
  return`<div class="game">
    <div class="game-row">
      <div class="game-img"><img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.parentElement.innerHTML='🎰'"/></div>
      <div class="game-info">
        <div class="game-title">${g.title}</div>
        <div class="game-provider">${g.prov} · ⏰ ${g.timeRangeStr}</div>
        <div class="badges">
          ${g.rtp>0?`<span class="badge b-rtp">RTP ${fmt(g.rtp)}%</span>`:''}
          ${g.n>0?`<span class="badge b-wr">B-WR ${fmt1(g.bw)}%</span>`:''}
          <span class="badge ${volCls}">${g.vol}</span>
          ${g.n>0?`<span class="badge b-votes">${g.n} votes</span>`:''}
          ${g.maxWin?`<span class="badge b-maxwin">${g.maxWin}</span>`:''}
          ${g.jackpotFreq>50?`<span class="badge b-jackpot">💎 ${g.jackpotFreq}</span>`:''}
          ${g.isHotNow?`<span class="badge b-time">⏰ Giờ đẹp!</span>`:''}
        </div>
        
        <!-- === PLAY NOW INDICATOR === -->
        <div class="play-now">
          <span style="font-size:10px;color:var(--text3)">Nên chơi</span>
          <div class="play-bar-wrap">
            <div class="play-bar-fill ${playCls}" style="width:${g.playScore}%"></div>
          </div>
          <span class="play-label ${playCls}">${g.playScore}%</span>
        </div>
        
        <!-- === VOLATILITY BAR === -->
        <div style="margin:6px 0">
          <div style="height:4px;background:var(--bg4);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${barPct}%;border-radius:2px;background:${g.vl==='low'?'var(--green)':g.vl==='medium'?'var(--gold)':'var(--red)'}"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:7px;color:var(--text3);margin-top:2px">
            <span>Low</span><span style="font-weight:700;color:${g.vl==='low'?'var(--green)':g.vl==='medium'?'var(--gold)':'var(--red)'}">${volLbl}</span><span>High</span>
          </div>
        </div>
        
        <!-- === 4 BET LEVELS === -->
        <div class="bet-levels">
          <div class="bet-level">
            <div class="lbl">Default</div>
            <div class="val ${g.betFollow>=70?'high':g.betFollow>=45?'medium':'low'}">${BET_VND[0].vnd}k</div>
            ${betBar(g.betFollow,g.betFollow>=70?'high':g.betFollow>=45?'medium':'low')}
            <div style="font-size:7px;color:var(--text3);margin-top:2px">${g.betFollow}%</div>
          </div>
          <div class="bet-level">
            <div class="lbl">Min</div>
            <div class="val ${g.betMin>=70?'high':g.betMin>=45?'medium':'low'}">${BET_VND[4].vnd}k</div>
            ${betBar(g.betMin,g.betMin>=70?'high':g.betMin>=45?'medium':'low')}
            <div style="font-size:7px;color:var(--text3);margin-top:2px">${g.betMin}%</div>
          </div>
          <div class="bet-level">
            <div class="lbl">Medium</div>
            <div class="val ${g.betMed>=70?'high':g.betMed>=45?'medium':'low'}">${BET_VND[9].vnd}k</div>
            ${betBar(g.betMed,g.betMed>=70?'high':g.betMed>=45?'medium':'low')}
            <div style="font-size:7px;color:var(--text3);margin-top:2px">${g.betMed}%</div>
          </div>
          <div class="bet-level">
            <div class="lbl">Max</div>
            <div class="val ${g.betMax>=70?'high':g.betMax>=45?'medium':'low'}">${BET_VND[14].vnd}k</div>
            ${betBar(g.betMax,g.betMax>=70?'high':g.betMax>=45?'medium':'low')}
            <div style="font-size:7px;color:var(--text3);margin-top:2px">${g.betMax}%</div>
          </div>
        </div>
        
        <a class="bet-demo" href="${g.demo}" target="_blank">▶ Chơi Demo - ${g.bet.pct} bankroll · ${g.bet.spins} spins</a>
      </div>
    </div>
  </div>`;
}

function aiCard(g,isLocal){
  const volCls={low:'b-vol-l',medium:'b-vol-m',high:'b-vol-h'}[g.vl];
  const playCls=g.playScore>=70?'hot':g.playScore>=40?'warm':'cold';
  const maxBet=Math.max(g.betFollow,g.betMin,g.betMax);
  
  return`<div class="game" style="border-color:rgba(240,185,11,0.3)">
    <div class="game-row">
      <div class="game-img"><img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.parentElement.innerHTML='🎰'"/></div>
      <div class="game-info">
        <div class="game-title">${g.title}</div>
        <div class="game-provider">${g.prov} · ⏰ ${g.timeRangeStr}</div>
        <div class="badges">
          ${isLocal?`<span class="badge b-wr" style="background:rgba(240,185,11,.2);color:var(--gold)">🧠 ${fmt(g.aiScore)}</span>`:''}
          ${g.rtp>0?`<span class="badge b-rtp">RTP ${fmt(g.rtp)}%</span>`:''}
          ${g.n>0?`<span class="badge b-wr">B-WR ${fmt1(g.bw)}%</span>`:''}
          <span class="badge ${volCls}">${g.vol}</span>
          ${g.n>0?`<span class="badge b-votes">${g.n} votes</span>`:''}
          ${g.isHotNow?`<span class="badge b-time">⏰ Giờ đẹp!</span>`:''}
        </div>
        
        <!-- PLAY NOW -->
        <div class="play-now">
          <span style="font-size:10px;color:var(--text3)">Nên chơi</span>
          <div class="play-bar-wrap"><div class="play-bar-fill ${playCls}" style="width:${g.playScore}%"></div></div>
          <span class="play-label ${playCls}">${g.playScore}%</span>
        </div>
        
        <!-- VOLATILITY -->
        <div style="margin:6px 0">
          <div style="height:4px;background:var(--bg4);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${VOL_BET[g.vl]?VOL_BET[g.vl].bar:55}%;border-radius:2px;background:${g.vl==='low'?'var(--green)':g.vl==='medium'?'var(--gold)':'var(--red)'}"></div>
          </div>
        </div>
        
        <!-- AI REASONS -->
        ${isLocal&&g.aiReasons?`<div style="margin:6px 0;padding:8px;background:rgba(240,185,11,.06);border-radius:8px;font-size:11px">
          <strong style="color:var(--gold)">🧠 AI phân tích:</strong> ${g.aiReasons.map(r=>`<span style="display:inline-block;margin:2px;padding:2px 6px;background:rgba(240,185,11,.1);border-radius:4px;color:var(--gold)">${r}</span>`).join('')}
        </div>`:''}
        
        <!-- 3 BET LEVELS -->
        <div class="bet-levels">
          <div class="bet-level"><div class="lbl">Default</div><div class="val ${g.betFollow>=60?'high':g.betFollow>=30?'medium':'low'}">${g.betFollow}%</div>${betBar(g.betFollow,g.betFollow>=60?'high':g.betFollow>=30?'medium':'low')}</div>
          <div class="bet-level"><div class="lbl">Min Bet</div><div class="val ${g.betMin>=60?'high':g.betMin>=30?'medium':'low'}">${g.betMin}%</div>${betBar(g.betMin,g.betMin>=60?'high':g.betMin>=30?'medium':'low')}</div>
          <div class="bet-level"><div class="lbl">Max Bet</div><div class="val ${g.betMax>=60?'high':g.betMax>=30?'medium':'low'}">${g.betMax}%</div>${betBar(g.betMax,g.betMax>=60?'high':g.betMax>=30?'medium':'low')}</div>
        </div>
        
        <a class="bet-demo" href="${g.demo}" target="_blank">▶ Chơi Demo</a>
      </div>
    </div>
  </div>`;
}

function sec(vl,list){
  if(!list.length)return'';
  const L={low:{i:'🟢',t:'Low Vol · Bet nhỏ, thắng đều',c:'low'},medium:{i:'🟡',t:'Medium Vol · Cân bằng, tối ưu',c:'med'},high:{i:'🔴',t:'High Vol · Big hit, rủi ro cao',c:'high'}}[vl];
  return`<div class="vsec"><div class="vhdr ${L.c}">${L.i} ${L.t}<span class="vcnt">${list.length} games</span></div>${list.map(card).join('')}</div>`;
}

function render(){
  renderStats();
  const a=filtered();
  const rt=$('root');
  if(!a.length){rt.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">📭 Không có game</div>';return;}
  if(filter==='vote'){
    const gr={low:[],medium:[],high:[]};
    a.forEach(g=>{if(gr[g.vl])gr[g.vl].push(g)});
    rt.innerHTML=sec('medium',gr.medium)+sec('low',gr.low)+sec('high',gr.high)||'<div style="text-align:center;padding:40px;color:var(--text3)">📭 Không có game</div>';
  }else if(filter==='classic'){
    // Chia thành các mục
    const now=new Date();
    const vnNow=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Ho_Chi_Minh'}));
    const curH=vnNow.getHours(),curM=vnNow.getMinutes(),curMin=curH*60+curM;
    
    // Hot game ngay bây giờ (trong khung giờ vàng)
    const hotNow=a.filter(g=>{
      const hs=g.timeH*60+g.timeM*30;
      const he=g.timeM?((g.timeH+1)%24)*60:(g.timeH*60+30);
      return curMin>=hs&&curMin<he;
    }).sort((a,b)=>b.playScore-a.playScore);
    
    // Feature games - top 3 game có score cao nhất + play score cao
    const featured=[...a].sort((a,b)=>(b.score+b.playScore/100*0.3)-(a.score+a.playScore/100*0.3)).slice(0,3);
    
    // High Winrate - sorted by Bayesian WR
    const highWR=[...a].sort((a,b)=>b.bw-a.bw).slice(0,10);
    
    // Jackpot Frequency
    const jackpot=[...a].sort((a,b)=>b.jackpotFreq-a.jackpotFreq).slice(0,10);
    
    rt.innerHTML=`
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:10px;color:var(--text3)">🕐 Giờ VN: <strong style="color:var(--gold)">${String(curH).padStart(2,'0')}:${String(curM).padStart(2,'0')}</strong></span>
      </div>
      
      ${hotNow.length?`
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(255,71,87,.1),transparent);border:1px solid rgba(255,71,87,.2);color:var(--red)">🔥 Hot ngay bây giờ <span class="vcnt">${hotNow.length} games</span></div>
        ${hotNow.slice(0,5).map(card).join('')}
      </div>`:''}
      
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(240,185,11,.1),transparent);border:1px solid rgba(240,185,11,.2);color:var(--gold)">🎯 Feature Games <span class="vcnt">Top 3</span></div>
        ${featured.map(card).join('')}
      </div>
      
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(0,214,143,.1),transparent);border:1px solid rgba(0,214,143,.2);color:var(--green)">📈 High Winrate <span class="vcnt">Top 10</span></div>
        ${highWR.map(card).join('')}
      </div>
      
      <div class="vsec">
        <div class="vhdr" style="background:linear-gradient(135deg,rgba(165,94,234,.1),transparent);border:1px solid rgba(165,94,234,.2);color:var(--purple)">💎 Jackpot Frequency <span class="vcnt">Top 10</span></div>
        ${jackpot.map(card).join('')}
      </div>`;
  }else if(filter==='ailocal'||filter==='ai'){
    rt.innerHTML=`<div style="margin-bottom:12px;padding:12px;background:rgba(240,185,11,.06);border:1px solid rgba(240,185,11,.15);border-radius:12px;font-size:12px;line-height:1.5">
      <strong style="color:var(--gold)">${filter==='ailocal'?'🧠 AI Local - Thuật toán riêng':'🤖 PG Ai - Đề xuất từ dữ liệu'}</strong><br>
      <span style="color:var(--text2)">${filter==='ailocal'?'Phân tích Bayesian WR + RTP + Vol + Confidence. Giờ Việt Nam (UTC+7).':'Dựa trên WR + votes + RTP, giống bản gốc PG Ai.'}</span>
    </div>${a.map(g=>aiCard(g,filter==='ailocal')).join('')}`;
  }else{
    rt.innerHTML=a.slice(0,50).map(card).join('');
  }
}

$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');
  if(!t)return;
  $('tabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  filter=t.dataset.f;
  render();
});

setInterval(()=>{cd--;$('cd').textContent=cd;if(cd<=0){cd=10;load();}},1000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
